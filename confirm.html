<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подтверждение заявки — КПП</title>
<meta property="og:title" content="Подтверждение заявки — КПП BMGS">
<meta property="og:description" content="Проверка и пересылка заявки на въезд на пост охраны">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f3; --surface: #ffffff; --surface-2: #f4f6f7; --border: #d8dee2;
    --text: #1b2226; --text-muted: #647079;
    --accent: #3a6fa8; --accent-bg: #e7eef7;
    --warn: #b8863a; --warn-bg: #fbf1de;
    --go: #2f8f5b;
    --stripe-a: #1b2226; --stripe-b: #d99a3d;
    --shadow: 0 1px 2px rgba(20,26,30,0.06), 0 4px 14px rgba(20,26,30,0.05);
    --radius: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171b; --surface: #1a2127; --surface-2: #212a31; --border: #303b43;
      --text: #e9edf0; --text-muted: #93a1aa;
      --accent: #6ea3d6; --accent-bg: #142a3d;
      --warn: #d9a54a; --warn-bg: #362a13;
      --go: #4fb47e;
      --stripe-a: #0c0f11; --stripe-b: #d9a54a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171b; --surface: #1a2127; --surface-2: #212a31; --border: #303b43;
    --text: #e9edf0; --text-muted: #93a1aa;
    --accent: #6ea3d6; --accent-bg: #142a3d;
    --warn: #d9a54a; --warn-bg: #362a13;
    --go: #4fb47e;
    --stripe-a: #0c0f11; --stripe-b: #d9a54a;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); min-height: 100%; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .stripes { height: 6px; width: 100%;
    background: repeating-linear-gradient(-45deg, var(--stripe-b), var(--stripe-b) 14px, var(--stripe-a) 14px, var(--stripe-a) 28px); }
  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  .header-inner { padding: 18px 18px 16px; }
  h1 { margin: 0 0 3px; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .subtitle { margin: 0; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 14px 48px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .badge-trial { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700;
    color: var(--warn); background: var(--warn-bg); padding: 5px 10px; border-radius: 999px; margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 2px; }
  .field-value { font-size: 15.5px; font-weight: 600; }
  .field-value.mono { font-size: 16.5px; }
  .btn { appearance: none; border: none; border-radius: 10px; padding: 13px 16px; font-family: inherit;
    font-weight: 700; font-size: 14.5px; cursor: pointer; width: 100%; margin-top: 10px;
    display: block; text-align: center; text-decoration: none; }
  .btn-go { background: var(--go); color: #fff; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .hint { font-size: 12.5px; color: var(--text-muted); margin-top: 10px; line-height: 1.5; }
  .empty { text-align: center; padding: 40px 16px; color: var(--text-muted); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 50; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="stripes"></div>
  <div class="header-inner">
    <h1>Подтверждение заявки</h1>
    <p class="subtitle" id="subtitle">Проверьте данные и перешлите на пункт охраны.</p>
  </div>
</header>

<main>
  <div class="card" id="content"></div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KPP_PHONE = '37122008858'; // ВРЕМЕННО тестовый номер — заменить на реальный WhatsApp поста охраны
  const CONFIRM_PIN = '5202'; // код подтверждения — знает только Олег. Поменять можно прямо тут, в одну строку.

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function esc(s) {
    const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML;
  }

  function fromToken(token) {
    try {
      const b64 = token.replace(/-/g, '+').replace(/_/g, '/');
      const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
      const json = decodeURIComponent(escape(atob(b64 + pad)));
      return JSON.parse(json);
    } catch (e) { return null; }
  }

  const p = new URLSearchParams(window.location.search);
  const token = p.get('d');
  const obj = token ? fromToken(token) : null;
  const data = obj ? {
    date: obj.d || '', time: obj.t || '',
    guest: obj.g || '', plate: obj.p || '', model: obj.m || '',
    trailer: obj.tr === 1, tplate: obj.tp || '', tmodel: obj.tm || '',
    purpose: obj.pu || '', resp: obj.r || ''
  } : { date:'', time:'', guest:'', plate:'', model:'', trailer:false, tplate:'', tmodel:'', purpose:'', resp:'' };

  function buildText() {
    const lines = [];
    lines.push('Дата и время визита: ' + data.date + (data.time ? ', ' + data.time : ''));
    lines.push('Гость (ФИО / компания): ' + data.guest);
    lines.push('Транспорт: ' + data.model + ', рег. номер ' + data.plate);
    if (data.trailer) lines.push('Прицеп: ' + (data.tmodel || '—') + ', рег. номер ' + data.tplate);
    if (data.purpose) lines.push('Цель визита: ' + data.purpose);
    lines.push('Заявку подал: ' + data.resp);
    return lines.join('\n');
  }

  const content = $('content');
  if (!data.plate && !data.guest) {
    content.innerHTML = '<div class="empty">Ссылка открыта без данных заявки — откройте её из сообщения с конкретной заявкой.</div>';
  } else {
    let html = '<span class="badge-trial">🧪 Пробная версия — пересылка на тестовый номер</span>';
    html += '<div class="field"><div class="field-label">Дата и время визита</div><div class="field-value">' + esc(data.date) + (data.time ? ', ' + esc(data.time) : '') + '</div></div>';
    html += '<div class="field"><div class="field-label">Гость</div><div class="field-value">' + esc(data.guest) + '</div></div>';
    html += '<div class="field"><div class="field-label">Транспорт</div><div class="field-value mono">' + esc(data.plate) + '</div><div class="field-value">' + esc(data.model) + '</div></div>';
    if (data.trailer) {
      html += '<div class="field"><div class="field-label">Прицеп</div><div class="field-value mono">' + esc(data.tplate) + '</div><div class="field-value">' + esc(data.tmodel || '—') + '</div></div>';
    }
    if (data.purpose) {
      html += '<div class="field"><div class="field-label">Цель визита</div><div class="field-value">' + esc(data.purpose) + '</div></div>';
    }
    html += '<div class="field"><div class="field-label">Заявку подал</div><div class="field-value">' + esc(data.resp) + '</div></div>';
    content.innerHTML = html;

    const waLink = document.createElement('a');
    waLink.className = 'btn btn-go';
    waLink.id = 'forwardLink';
    waLink.target = '_top';
    waLink.rel = 'noopener';
    waLink.textContent = 'Утвердить и переслать на КПП';
    waLink.style.display = 'none';

    const pinWrap = document.createElement('div');
    pinWrap.style.marginTop = '10px';
    pinWrap.innerHTML =
      '<div class="field-label" style="margin-bottom:6px;">Код подтверждения</div>' +
      '<input type="text" inputmode="numeric" id="pinInput" maxlength="8" placeholder="····" ' +
      'style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;' +
      'padding:12px;font-family:\'IBM Plex Mono\',monospace;font-size:20px;letter-spacing:0.3em;' +
      'text-align:center;color:var(--text);outline:none;">';
    const pinBtn = document.createElement('button');
    pinBtn.className = 'btn btn-secondary';
    pinBtn.textContent = 'Разблокировать';
    pinWrap.appendChild(pinBtn);

    content.appendChild(pinWrap);
    content.appendChild(waLink);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn btn-secondary';
    copyBtn.textContent = 'Скопировать текст';
    content.appendChild(copyBtn);

    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.innerHTML = 'Код подтверждения знает только начальник охраны. Без него отправить на КПП нельзя.';
    content.appendChild(hint);

    function waText() {
      return 'Пропуск подтверждён, направляю на КПП:\n' + buildText();
    }
    function waUrl() {
      return 'https://wa.me/' + KPP_PHONE + '?text=' + encodeURIComponent(waText());
    }

    function unlock() {
      const val = $('pinInput').value.trim();
      if (val === CONFIRM_PIN) {
        pinWrap.style.display = 'none';
        waLink.style.display = 'block';
        waLink.href = waUrl();
        toast('Разблокировано');
      } else {
        toast('Неверный код');
        $('pinInput').value = '';
        $('pinInput').focus();
      }
    }
    pinBtn.addEventListener('click', unlock);
    pinWrap.querySelector('#pinInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlock();
    });

    waLink.addEventListener('click', () => { waLink.href = waUrl(); });

    copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(waText()); toast('Текст скопирован'); }
      catch (e) { toast('Не удалось скопировать — выделите текст вручную'); }
    });
  }
})();
</script>

</body>
</html>
