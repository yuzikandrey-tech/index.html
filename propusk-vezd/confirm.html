<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подтверждение заявки — КПП</title>
<meta property="og:title" content="Подтверждение заявки — КПП BMGS">
<meta property="og:description" content="Проверка и пересылка заявки на въезд на пост охраны">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f3; --surface: #ffffff; --surface-2: #f4f6f7; --border: #d8dee2;
    --text: #1b2226; --text-muted: #647079;
    --accent: #3a6fa8; --accent-bg: #e7eef7;
    --warn: #b8863a; --warn-bg: #fbf1de;
    --go: #2f8f5b;
    --stripe-a: #1b2226; --stripe-b: #d99a3d;
    --shadow: 0 1px 2px rgba(20,26,30,0.06), 0 4px 14px rgba(20,26,30,0.05);
    --radius: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171b; --surface: #1a2127; --surface-2: #212a31; --border: #303b43;
      --text: #e9edf0; --text-muted: #93a1aa;
      --accent: #6ea3d6; --accent-bg: #142a3d;
      --warn: #d9a54a; --warn-bg: #362a13;
      --go: #4fb47e;
      --stripe-a: #0c0f11; --stripe-b: #d9a54a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171b; --surface: #1a2127; --surface-2: #212a31; --border: #303b43;
    --text: #e9edf0; --text-muted: #93a1aa;
    --accent: #6ea3d6; --accent-bg: #142a3d;
    --warn: #d9a54a; --warn-bg: #362a13;
    --go: #4fb47e;
    --stripe-a: #0c0f11; --stripe-b: #d9a54a;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); min-height: 100%; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .stripes { height: 6px; width: 100%;
    background: repeating-linear-gradient(-45deg, var(--stripe-b), var(--stripe-b) 14px, var(--stripe-a) 14px, var(--stripe-a) 28px); }
  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  .header-inner { padding: 18px 18px 16px; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .lang-switch { display: flex; gap: 4px; flex-shrink: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .lang-btn { appearance: none; border: none; background: transparent; color: var(--text-muted); font-family: inherit;
    font-weight: 700; font-size: 12px; padding: 6px 11px; border-radius: 999px; cursor: pointer; }
  .lang-btn.active { background: var(--text); color: var(--bg); }
  h1 { margin: 0 0 3px; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .subtitle { margin: 0; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 14px 48px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .badge-trial { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700;
    color: var(--warn); background: var(--warn-bg); padding: 5px 10px; border-radius: 999px; margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 2px; }
  .field-value { font-size: 15.5px; font-weight: 600; }
  .field-value.mono { font-size: 16.5px; }
  .btn { appearance: none; border: none; border-radius: 10px; padding: 13px 16px; font-family: inherit;
    font-weight: 700; font-size: 14.5px; cursor: pointer; width: 100%; margin-top: 10px;
    display: block; text-align: center; text-decoration: none; }
  .btn-go { background: var(--go); color: #fff; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .hint { font-size: 12.5px; color: var(--text-muted); margin-top: 10px; line-height: 1.5; }
  .empty { text-align: center; padding: 40px 16px; color: var(--text-muted); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 50; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="stripes"></div>
  <div class="header-inner">
    <div class="header-top">
      <div>
        <h1 data-i18n="h1">Подтверждение заявок</h1>
        <p class="subtitle" id="subtitle" data-i18n="subtitle">Проверьте заявку, введите код и перешлите на пункт охраны.</p>
      </div>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="lv">LV</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div id="list"></div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KPP_PHONE = '37122008858'; // ВРЕМЕННО тестовый номер — заменить на реальный WhatsApp поста охраны
  // ЗАМЕНИ на адрес твоего Apps Script веб-приложения (заканчивается на /exec)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzeH8oRpI620YYlDC6_oMVKITTTy4bSe2iS_ipEjPKlqbVNk6p73UhZcHqs-1enBTAu/exec';

  const STR = {
    ru: {
      h1: 'Подтверждение заявок',
      subtitle: 'Проверьте заявку, введите код и перешлите на пункт охраны.',
      fVisit: 'Дата и время визита', fGuest: 'Гость', fTransport: 'Транспорт', fTrailer: 'Прицеп',
      fPurpose: 'Цель визита', fSubmitted: 'Заявку подал', fPin: 'Код подтверждения',
      btnApprove: 'Утвердить и переслать на КПП', btnApproving: '...',
      empty: 'Нет заявок, ожидающих подтверждения.',
      loading: 'Загрузка…',
      loadFail: 'Не удалось загрузить список. Проверьте связь и перезагрузите страницу.',
      toastOk: 'Утверждено — открываю WhatsApp',
      toastWrong: 'Неверный код',
      toastErr: 'Ошибка — попробуйте ещё раз',
      toastNoConn: 'Нет связи с сервером',
      waHeader: 'Пропуск подтверждён, направляю на КПП:',
      txtVisit: 'Дата и время визита:', txtGuest: 'Гость (ФИО / компания):', txtTransport: 'Транспорт:',
      txtTrailer: 'Прицеп:', txtPurpose: 'Цель визита:', txtSubmitted: 'Заявку подал:', regNum: 'рег. номер'
    },
    lv: {
      h1: 'Pieteikumu apstiprināšana',
      subtitle: 'Pārbaudiet pieteikumu, ievadiet kodu un pārsūtiet uz apsardzes posteni.',
      fVisit: 'Vizītes datums un laiks', fGuest: 'Viesis', fTransport: 'Transports', fTrailer: 'Piekabe',
      fPurpose: 'Vizītes mērķis', fSubmitted: 'Pieteikumu iesniedza', fPin: 'Apstiprinājuma kods',
      btnApprove: 'Apstiprināt un pārsūtīt uz posteni', btnApproving: '...',
      empty: 'Nav pieteikumu, kas gaida apstiprinājumu.',
      loading: 'Ielāde…',
      loadFail: 'Neizdevās ielādēt sarakstu. Pārbaudiet savienojumu un pārlādējiet lapu.',
      toastOk: 'Apstiprināts — atveru WhatsApp',
      toastWrong: 'Nepareizs kods',
      toastErr: 'Kļūda — mēģiniet vēlreiz',
      toastNoConn: 'Nav savienojuma ar serveri',
      waHeader: 'Caurlaide apstiprināta, nosūtu uz posteni:',
      txtVisit: 'Vizītes datums un laiks:', txtGuest: 'Viesis (vārds, uzvārds / uzņēmums):', txtTransport: 'Transports:',
      txtTrailer: 'Piekabe:', txtPurpose: 'Vizītes mērķis:', txtSubmitted: 'Pieteikumu iesniedza:', regNum: 'reģ. numurs'
    }
  };

  let lang = localStorage.getItem('propusk_lang') || 'ru';

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = STR[lang][el.dataset.i18n];
    });
    document.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    load();
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      lang = btn.dataset.lang;
      localStorage.setItem('propusk_lang', lang);
      applyLang();
    });
  });

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function esc(s) {
    const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML;
  }

  function fmtTime(t) {
    if (typeof t === 'string' && t.indexOf('1899-12-30T') === 0) {
      return t.slice(11, 16);
    }
    return t;
  }

  function buildText(r) {
    const T = STR[lang];
    const lines = [];
    lines.push(T.txtVisit + ' ' + r.date + (r.time ? ', ' + fmtTime(r.time) : ''));
    lines.push(T.txtGuest + ' ' + r.guest);
    lines.push(T.txtTransport + ' ' + r.model + ', ' + T.regNum + ' ' + r.plate);
    if (r.trailer) lines.push(T.txtTrailer + ' ' + (r.trailerModel || '—') + ', ' + T.regNum + ' ' + r.trailerPlate);
    if (r.purpose) lines.push(T.txtPurpose + ' ' + r.purpose);
    lines.push(T.txtSubmitted + ' ' + r.responsible);
    return lines.join('\n');
  }

  function waUrl(r) {
    const text = STR[lang].waHeader + '\n' + buildText(r);
    return 'https://wa.me/' + KPP_PHONE + '?text=' + encodeURIComponent(text);
  }

  function reqCard(r) {
    const T = STR[lang];
    let html = '<div class="card" data-id="' + esc(r.id) + '">';
    html += '<div class="field"><div class="field-label">' + T.fVisit + '</div><div class="field-value">' + esc(r.date) + (r.time ? ', ' + esc(fmtTime(r.time)) : '') + '</div></div>';
    html += '<div class="field"><div class="field-label">' + T.fGuest + '</div><div class="field-value">' + esc(r.guest) + '</div></div>';
    html += '<div class="field"><div class="field-label">' + T.fTransport + '</div><div class="field-value mono">' + esc(r.plate) + '</div><div class="field-value">' + esc(r.model) + '</div></div>';
    if (r.trailer) {
      html += '<div class="field"><div class="field-label">' + T.fTrailer + '</div><div class="field-value mono">' + esc(r.trailerPlate) + '</div><div class="field-value">' + esc(r.trailerModel || '—') + '</div></div>';
    }
    if (r.purpose) {
      html += '<div class="field"><div class="field-label">' + T.fPurpose + '</div><div class="field-value">' + esc(r.purpose) + '</div></div>';
    }
    html += '<div class="field"><div class="field-label">' + T.fSubmitted + '</div><div class="field-value">' + esc(r.responsible) + '</div></div>';
    html += '<div class="field" style="margin-top:14px;">';
    html += '<div class="field-label" style="margin-bottom:6px;">' + T.fPin + '</div>';
    html += '<input type="text" inputmode="numeric" maxlength="8" placeholder="····" data-pin ' +
      'style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;' +
      'padding:12px;font-family:\'IBM Plex Mono\',monospace;font-size:20px;letter-spacing:0.3em;' +
      'text-align:center;color:var(--text);outline:none;">';
    html += '</div>';
    html += '<button class="btn btn-go" data-approve>' + T.btnApprove + '</button>';
    html += '</div>';
    return html;
  }

  let requestsById = {};

  async function load() {
    $('list').innerHTML = '<div class="empty">' + STR[lang].loading + '</div>';
    try {
      const res = await fetch(SCRIPT_URL, { method: 'GET' });
      const data = await res.json();
      if (!data.ok) throw new Error('bad response');
      if (!data.requests.length) {
        $('list').innerHTML = '<div class="empty">' + STR[lang].empty + '</div>';
        return;
      }
      requestsById = {};
      data.requests.forEach(r => { requestsById[r.id] = r; });
      $('list').innerHTML = data.requests.map(reqCard).join('');
    } catch (e) {
      $('list').innerHTML = '<div class="empty">' + STR[lang].loadFail + '</div>';
      console.error(e);
    }
  }

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-approve]');
    if (!btn) return;
    const card = btn.closest('.card');
    const id = card.dataset.id;
    const pin = card.querySelector('[data-pin]').value.trim();
    btn.disabled = true;
    btn.textContent = STR[lang].btnApproving;
    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'approve', id: id, pin: pin })
      });
      const data = await res.json();
      if (data.ok) {
        const r = requestsById[id];
        const a = document.createElement('a');
        a.href = waUrl(r);
        a.target = '_top';
        a.rel = 'noopener';
        a.click();
        toast(STR[lang].toastOk);
        load();
      } else if (data.error === 'wrong_pin') {
        toast(STR[lang].toastWrong);
        card.querySelector('[data-pin]').value = '';
        card.querySelector('[data-pin]').focus();
        btn.disabled = false;
        btn.textContent = STR[lang].btnApprove;
      } else {
        toast(STR[lang].toastErr);
        btn.disabled = false;
        btn.textContent = STR[lang].btnApprove;
      }
    } catch (err) {
      console.error(err);
      toast(STR[lang].toastNoConn);
      btn.disabled = false;
      btn.textContent = STR[lang].btnApprove;
    }
  });

  applyLang();
})();
</script>

</body>
</html>
